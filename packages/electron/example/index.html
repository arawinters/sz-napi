<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Senzing Desktop SDK Example</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; background: #1a1a2e; color: #eee; }
    h1 { color: #00d4ff; }
    button { background: #00d4ff; color: #1a1a2e; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; font-size: 0.9rem; margin: 0.25rem; }
    button:hover { background: #00b8d9; }
    input, textarea { background: #16213e; color: #eee; border: 1px solid #0f3460; padding: 0.5rem; border-radius: 4px; width: 100%; box-sizing: border-box; }
    textarea { font-family: monospace; font-size: 0.85rem; }
    .section { margin: 1.5rem 0; padding: 1rem; background: #16213e; border-radius: 8px; }
    .label { color: #888; font-size: 0.8rem; margin-bottom: 0.25rem; }
    #output { white-space: pre-wrap; font-family: monospace; font-size: 0.85rem; max-height: 400px; overflow-y: auto; }
    .output-entry { position: relative; padding: 0.25rem 0; border-bottom: 1px solid #0f3460; }
    .output-entry .copy-btn { position: absolute; top: 0.25rem; right: 0; background: #0f3460; color: #888; border: none; padding: 0.15rem 0.4rem; border-radius: 3px; cursor: pointer; font-size: 0.7rem; opacity: 0; transition: opacity 0.15s; }
    .output-entry:hover .copy-btn { opacity: 1; }
    .output-entry .copy-btn:hover { color: #eee; background: #00d4ff; }
    .error { color: #ff6b6b; }
    .success { color: #51cf66; }
  </style>
</head>
<body>
  <h1>Senzing Desktop SDK</h1>

  <div class="section">
    <div class="label">Settings JSON</div>
    <input id="settings" value='{"PIPELINE":{"CONFIGPATH":"/opt/senzing/er/resources/templates","RESOURCEPATH":"/opt/senzing/er/resources","SUPPORTPATH":"/opt/senzing/data"},"SQL":{"CONNECTION":"sqlite3://na:na@/tmp/sz-electron-example.db"}}' />
    <br/><br/>
    <button id="btn-init">Initialize</button>
    <button id="btn-version">Get Version</button>
    <button id="btn-destroy">Destroy</button>
  </div>

  <div class="section">
    <div class="label">Add Record</div>
    <input id="ds-code" placeholder="Data source code" value="TEST" style="width:30%;display:inline-block" />
    <input id="rec-id" placeholder="Record ID" value="1" style="width:20%;display:inline-block" />
    <br/><br/>
    <textarea id="rec-def" rows="3">{"NAME_FULL": "Robert Smith", "DATE_OF_BIRTH": "1985-02-15", "ADDR_FULL": "123 Main St, Las Vegas NV 89101"}</textarea>
    <br/><br/>
    <button id="btn-add">Add Record</button>
  </div>

  <div class="section">
    <div class="label">Search</div>
    <textarea id="search-attrs" rows="2">{"NAME_FULL": "Robert Smith"}</textarea>
    <br/><br/>
    <button id="btn-search">Search</button>
  </div>

  <div class="section">
    <div class="label">Output</div>
    <div id="output"></div>
  </div>

  <script>
    const output = document.getElementById('output');
    function log(msg, cls) {
      const text = typeof msg === 'string' ? msg : JSON.stringify(msg, null, 2);
      const entry = document.createElement('div');
      entry.className = 'output-entry ' + (cls || '');
      const content = document.createElement('span');
      content.textContent = text;
      const copyBtn = document.createElement('button');
      copyBtn.className = 'copy-btn';
      copyBtn.textContent = 'Copy';
      copyBtn.onclick = () => {
        navigator.clipboard.writeText(text).then(() => {
          copyBtn.textContent = 'Copied!';
          setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1200);
        });
      };
      entry.appendChild(content);
      entry.appendChild(copyBtn);
      output.prepend(entry);
    }

    // Select all text on focus for easy paste-over
    document.querySelectorAll('input, textarea').forEach(el => {
      el.addEventListener('focus', () => el.select());
    });

    document.getElementById('btn-init').onclick = async () => {
      try {
        const settings = document.getElementById('settings').value;
        await window.senzing.initialize(settings);
        log('Initialized.', 'success');
      } catch (e) { log(e.message, 'error'); }
    };

    document.getElementById('btn-version').onclick = async () => {
      try {
        const v = await window.senzing.product.getVersion();
        log(JSON.parse(v));
      } catch (e) { log(e.message, 'error'); }
    };

    document.getElementById('btn-destroy').onclick = async () => {
      try {
        await window.senzing.destroy();
        log('Destroyed.', 'success');
      } catch (e) { log(e.message, 'error'); }
    };

    document.getElementById('btn-add').onclick = async () => {
      try {
        const ds = document.getElementById('ds-code').value;
        const id = document.getElementById('rec-id').value;
        const def = document.getElementById('rec-def').value;
        const result = await window.senzing.engine.addRecord(ds, id, def, window.senzing.flags.WITH_INFO);
        log(JSON.parse(result), 'success');
      } catch (e) { log(e.message, 'error'); }
    };

    document.getElementById('btn-search').onclick = async () => {
      try {
        const attrs = document.getElementById('search-attrs').value;
        const result = await window.senzing.engine.searchByAttributes(attrs);
        log(JSON.parse(result));
      } catch (e) { log(e.message, 'error'); }
    };
  </script>
</body>
</html>
